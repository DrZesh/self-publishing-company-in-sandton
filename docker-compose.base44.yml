services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
